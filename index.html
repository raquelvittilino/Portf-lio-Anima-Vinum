<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anima Vinum · Portfólio Ativo</title>
<style>
  :root{
    --bordeaux:#722F37; --bordeaux-dark:#571f26; --gold:#C9A961; --cream:#FAF6F0;
    --ink:#2b2320; --muted:#8a7f76; --line:#e8dfd3; --white:#fff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:Arial, Helvetica, sans-serif; background:var(--cream); color:var(--ink)}
  .serif{font-family:Georgia, 'Times New Roman', serif}

  header{background:var(--bordeaux); color:#fff; padding:26px 20px 20px; text-align:center}
  header h1{font-family:Georgia, serif; font-weight:normal; letter-spacing:.35em; font-size:24px}
  header .sub{color:var(--gold); font-family:Georgia, serif; font-style:italic; margin-top:6px; font-size:14px}
  header .meta{font-size:11px; opacity:.75; margin-top:8px; letter-spacing:.08em}

  .controls{position:sticky; top:0; z-index:20; background:var(--cream); border-bottom:1px solid var(--line); padding:12px 16px}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:1080px; margin:0 auto}
  .row + .row{margin-top:8px}
  input[type=search]{flex:1 1 220px; padding:9px 12px; border:1px solid var(--line); border-radius:20px; font-size:14px; background:#fff; outline:none}
  input[type=search]:focus{border-color:var(--gold)}
  .chip{border:1px solid var(--line); background:#fff; border-radius:16px; padding:6px 13px; font-size:12.5px; cursor:pointer; color:var(--ink); white-space:nowrap}
  .chip.on{background:var(--bordeaux); color:#fff; border-color:var(--bordeaux)}
  select,.num{padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:12.5px; color:var(--ink)}
  .num{width:92px}
  .toggle{display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; user-select:none; color:var(--muted)}
  .toggle .sw{width:34px; height:18px; border-radius:10px; background:#d8cfc2; position:relative; transition:.2s}
  .toggle .sw::after{content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s}
  .toggle.on .sw{background:var(--bordeaux)}
  .toggle.on .sw::after{left:18px}
  .btn{border:1px solid var(--bordeaux); color:var(--bordeaux); background:#fff; border-radius:8px; padding:7px 12px; font-size:12.5px; cursor:pointer}
  .btn:hover{background:var(--bordeaux); color:#fff}
  .count{font-size:12px; color:var(--muted); margin-left:auto}

  main{max-width:1080px; margin:0 auto; padding:10px 16px 90px}
  .fam{font-family:Georgia, serif; color:var(--bordeaux); font-size:19px; margin:26px 4px 2px; border-bottom:2px solid var(--gold); padding-bottom:6px; display:flex; justify-content:space-between; align-items:baseline}
  .fam small{font-family:Arial; font-size:11px; color:var(--muted)}
  .card{display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px}
  .card input[type=checkbox]{width:16px; height:16px; accent-color:var(--bordeaux); flex:none}
  .info{flex:1; min-width:0}
  .nome{font-family:Georgia, serif; font-size:15.5px}
  .nome .safra{color:var(--gold); font-size:13px}
  .det{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5}
  .badges{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}
  .bdg{font-size:10px; padding:2px 8px; border-radius:9px; letter-spacing:.04em}
  .b-cor{background:#f1e8dc; color:#7a6a4f}
  .b-tinto{background:#f3e3e4; color:#722F37}
  .b-mag{background:#e8eef0; color:#3d616d}
  .b-last{background:#fdecec; color:#b3261e; font-weight:bold}
  .b-cave{background:#ece7f2; color:#5b4a7a}
  .preco{text-align:right; flex:none}
  .preco .v{font-family:Georgia, serif; font-size:16.5px; color:var(--bordeaux); white-space:nowrap}
  .preco .r{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap}
  .preco .cod{font-size:10px; color:#c0b6ab; margin-top:2px; letter-spacing:.06em}

  .selbar{position:fixed; bottom:0; left:0; right:0; background:var(--bordeaux-dark); color:#fff; padding:10px 16px; display:none; z-index:30}
  .selbar .row{max-width:1080px; margin:0 auto; justify-content:space-between}
  .selbar button{background:var(--gold); border:none; color:#3d2f10; font-weight:bold; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:13px}
  .selbar .clr{background:transparent; border:1px solid rgba(255,255,255,.5); color:#fff; font-weight:normal}
  .empty{color:var(--muted); text-align:center; padding:60px 0; font-style:italic; font-family:Georgia, serif}
  .note{max-width:1080px; margin:24px auto 0; font-size:10.5px; color:#b3a89b; text-align:center}

  @media(max-width:640px){
    header h1{font-size:19px; letter-spacing:.25em}
    .nome{font-size:14px}
    .preco .v{font-size:15px}
  }
  @media print{
    .controls,.selbar,.card input[type=checkbox]{display:none !important}
    body{background:#fff}
    header{background:#fff; color:var(--bordeaux)}
    header .meta{color:var(--muted)}
    .card{border:none; border-bottom:1px solid var(--line); border-radius:0; break-inside:avoid; padding:7px 2px}
    main{padding-bottom:0}
  }
</style>
</head>
<body>
<header>
  <h1>ANIMA VINUM</h1>
  <div class="sub">Portfólio de Vinhos Ativos</div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="row">
    <input type="search" id="q" placeholder="Buscar vinho, produtor, uva ou código…">
    <select id="produtor"><option value="">Todos os produtores</option></select>
    <select id="sort">
      <option value="padrao">Ordem: produtor</option>
      <option value="preco-asc">Menor preço</option>
      <option value="preco-desc">Maior preço</option>
      <option value="safra">Safra (antiga → nova)</option>
    </select>
  </div>
  <div class="row" id="fams"></div>
  <div class="row">
    <span id="cores"></span>
    <input class="num" id="pmin" type="number" placeholder="R$ mín" min="0">
    <input class="num" id="pmax" type="number" placeholder="R$ máx" min="0">
    <select id="formato">
      <option value="">Todos os formatos</option>
      <option value="750 ml">750 ml</option>
      <option value="Magnum 1,5 L">Magnum 1,5 L</option>
    </select>
    <label class="toggle" id="cliente"><span class="sw"></span> Modo cliente</label>
    <button class="btn" onclick="window.print()">Imprimir / PDF</button>
    <span class="count" id="count"></span>
  </div>
</div>

<main id="lista"></main>
<div class="note">Revenda = 40% de desconto sobre o valor de lista · Valores em reais · Sujeito a disponibilidade de estoque</div>

<div class="selbar" id="selbar">
  <div class="row">
    <span id="selcount"></span>
    <span style="display:flex;gap:8px">
      <button class="clr" onclick="clearSel()">Limpar</button>
      <button onclick="copySel()">Copiar lista</button>
    </span>
  </div>
</div>

const UPDATED = '12/08/2026';
const FAMS = ['Bourgogne','Champagne','Rhône','Jura','La Combe du Soleil','Hospices de Beaune'];
const CORES = ['Branco','Tinto','Rosé','Champagne'];
let selFams = new Set(), selCores = new Set(), clienteMode = false;
const sel = new Map();

const $ = id => document.getElementById(id);
const fmt = n => n == null ? 'Consultar' : 'R$ ' + n.toLocaleString('pt-BR');

document.querySelector('#meta').textContent = DATA.length + ' RÓTULOS · ATUALIZADO EM ' + UPDATED;

FAMS.forEach(f => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = f;
  b.onclick = () => { selFams.has(f) ? selFams.delete(f) : selFams.add(f); b.classList.toggle('on'); render(); };
  $('fams').appendChild(b);
});
CORES.forEach(c => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = c;
  b.onclick = () => { selCores.has(c) ? selCores.delete(c) : selCores.add(c); b.classList.toggle('on'); render(); };
  $('cores').appendChild(b);
});
[...new Set(DATA.map(x => x.p))].sort((a,b)=>a.localeCompare(b,'pt')).forEach(p => {
  const o = document.createElement('option'); o.value = o.textContent = p; $('produtor').appendChild(o);
});
['q','pmin','pmax'].forEach(id => $(id).addEventListener('input', render));
['produtor','sort','formato'].forEach(id => $(id).addEventListener('change', render));
$('cliente').onclick = () => { clienteMode = !clienteMode; $('cliente').classList.toggle('on'); render(); };

const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function filtered(){
  const q = strip($('q').value.trim());
  const prod = $('produtor').value, formato = $('formato').value;
  const pmin = parseFloat($('pmin').value), pmax = parseFloat($('pmax').value);
  let out = DATA.filter(x =>
    (!selFams.size || selFams.has(x.f)) &&
    (!selCores.size || [...selCores].some(c => x.cor.startsWith(c))) &&
    (!prod || x.p === prod) && (!formato || x.litro === formato) &&
    (isNaN(pmin) || (x.preco != null && x.preco >= pmin)) &&
    (isNaN(pmax) || (x.preco != null && x.preco <= pmax)) &&
    (!q || strip(x.v + ' ' + x.p + ' ' + x.u + ' ' + x.c + ' ' + x.s).includes(q))
  );
  const s = $('sort').value;
  if (s === 'preco-asc') out.sort((a,b) => (a.preco ?? 1e9) - (b.preco ?? 1e9));
  if (s === 'preco-desc') out.sort((a,b) => (b.preco ?? -1) - (a.preco ?? -1));
  if (s === 'safra') out.sort((a,b) => (a.s || '9999').localeCompare(b.s || '9999'));
  return out;
}

function render(){
  const out = filtered(), sorted = $('sort').value !== 'padrao';
  $('count').textContent = out.length + ' de ' + DATA.length + ' rótulos';
  const el = $('lista'); el.innerHTML = '';
  if (!out.length){ el.innerHTML = '<div class="empty">Nenhum vinho encontrado com esses filtros.</div>'; return; }
  let lastFam = null;
  out.forEach(x => {
    if (!sorted && x.f !== lastFam){
      lastFam = x.f;
      const h = document.createElement('div'); h.className = 'fam';
      h.innerHTML = '<span>' + x.f + '</span><small>' + out.filter(y => y.f === x.f).length + ' rótulos</small>';
      el.appendChild(h);
    }
    const d = document.createElement('div'); d.className = 'card';
    const badges = [];
    badges.push('<span class="bdg ' + (x.cor.startsWith('Tinto') ? 'b-tinto' : 'b-cor') + '">' + x.cor + '</span>');
    if (x.litro !== '750 ml') badges.push('<span class="bdg b-mag">' + x.litro + '</span>');
    if (x.cave) badges.push('<span class="bdg b-cave">Millésime de cave</span>');
    if (!clienteMode && x.est <= 3) badges.push('<span class="bdg b-last">Últimas ' + x.est + ' grfs</span>');
    d.innerHTML =
      '<input type="checkbox" ' + (sel.has(x.c + x.s) ? 'checked' : '') + '>' +
      '<div class="info"><div class="nome">' + x.v + ' <span class="safra">' + (x.s || '') + '</span></div>' +
      '<div class="det">' + x.p + ' · ' + x.u + '</div>' +
      '<div class="badges">' + badges.join('') + '</div></div>' +
      '<div class="preco"><div class="v">' + fmt(x.preco) + '</div>' +
      (!clienteMode && x.rev ? '<div class="r">revenda ' + fmt(x.rev) + '</div>' : '') +
      (!clienteMode ? '<div class="cod">' + x.c + '</div>' : '') + '</div>';
    d.querySelector('input').onchange = e => {
      e.target.checked ? sel.set(x.c + x.s, x) : sel.delete(x.c + x.s);
      updateSelbar();
    };
    el.appendChild(d);
  });
}

function updateSelbar(){
  $('selbar').style.display = sel.size ? 'block' : 'none';
  $('selcount').textContent = sel.size + ' vinho' + (sel.size > 1 ? 's' : '') + ' selecionado' + (sel.size > 1 ? 's' : '');
}
function clearSel(){ sel.clear(); updateSelbar(); render(); }
function copySel(){
  const lines = [...sel.values()].map(x =>
    x.v + (x.s ? ' ' + x.s : '') + ' · ' + x.p + (x.litro !== '750 ml' ? ' · ' + x.litro : '') + ' — ' + fmt(x.preco));
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const b = document.querySelector('#selbar button:last-child');
    b.textContent = 'Copiado ✓'; setTimeout(() => b.textContent = 'Copiar lista', 1600);
  });
}
render();
</script>
